<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --text: #111111;
      --muted: #666666;
      --line: #e9e9e6;
      font-family: "Avenir Next", "PingFang SC", "Helvetica Neue", sans-serif;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: transparent;
    }

    footer {
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 14px;
    }

    .footer-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    .footer-links a:hover {
      color: var(--text);
    }

    .copyright {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <footer>
    <div class="footer-links">
      <a href="privacy.html" target="_parent">隐私政策</a>
      <a href="terms.html" target="_parent">使用条款</a>
      <a href="contact.html" target="_parent">联系我们</a>
    </div>
    <p class="copyright">© 2026 放放. All rights reserved.</p>
  </footer>
</body>
</html>
