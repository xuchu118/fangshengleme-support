<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 - 放生了么</title>
  <meta name="description" content="放生了么联系页面。">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #e9e9e6;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.06);
      font-family: "Avenir Next", "PingFang SC", "Helvetica Neue", sans-serif;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 40px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
    }

    .brand img {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    .brand strong {
      display: block;
      font-size: 17px;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--text);
    }

    .card {
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 48px);
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 0 14px;
      line-height: 1.8;
      color: var(--muted);
    }

    .contact-list {
      display: grid;
      gap: 14px;
      margin-top: 24px;
    }

    .contact-item {
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fafaf8;
    }

    .contact-item strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
    }

    .contact-item a {
      color: var(--muted);
      text-decoration: none;
    }

    .contact-item a:hover {
      color: var(--text);
    }

    footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    footer p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="index.html">
        <img src="icon.png" alt="App 图标">
        <strong>放生了么</strong>
      </a>
      <a class="back-link" href="index.html">返回首页</a>
    </header>

    <main class="card">
      <h1>联系我们</h1>
      <p>如果您对《放生了么》有任何使用问题、意见建议、隐私相关疑问或合作需求，可以通过以下方式与我们联系。</p>

      <div class="contact-list">
        <div class="contact-item">
          <strong>联系邮箱</strong>
          <a href="mailto:fangshengleme@163.com">fangshengleme@163.com</a>
        </div>
      </div>
    </main>

    <footer>
      <p>© 2026 放生了么. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
