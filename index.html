<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放放的个人站点</title>
  <meta name="description" content="一个简约的 App 展示页。">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #e9e9e6;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.06);
      font-family: "Avenir Next", "PingFang SC", "Helvetica Neue", sans-serif;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 56px;
    }

    header img {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    header div {
      display: grid;
      gap: 2px;
    }

    header strong {
      font-size: 17px;
      font-weight: 600;
    }

    .intro p,
    .info-card p {
      color: var(--muted);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 48px;
      align-items: center;
    }

    .intro h1 {
      margin: 0 0 18px;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .intro p {
      margin: 0 0 28px;
      max-width: 520px;
      font-size: 18px;
      line-height: 1.8;
    }

    .store-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-radius: 16px;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .store-badge:hover {
      transform: translateY(-1px);
      opacity: 0.94;
    }

    .store-badge-mark {
      flex: 0 0 auto;
      font-size: 30px;
      line-height: 1;
      font-family: "SF Pro Display", "Helvetica Neue", sans-serif;
    }

    .store-badge-copy {
      display: grid;
      gap: 2px;
      line-height: 1.05;
    }

    .store-badge-copy small,
    .store-badge-copy strong {
      color: #ffffff;
    }

    .store-badge-copy small {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .store-badge-copy strong {
      font-size: 22px;
      font-weight: 600;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .meta span {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-size: 14px;
      color: var(--muted);
    }

    .phone-frame {
      width: 100%;
    }

    .carousel {
      overflow: hidden;
      width: 100%;
    }

    .carousel-track {
      display: flex;
      transition: transform 420ms ease;
      will-change: transform;
    }

    .carousel-slide {
      flex: 0 0 100%;
      min-width: 100%;
    }

    .carousel-slide img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: var(--shadow);
    }

    .info-card h2 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: -0.03em;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .carousel-dot {
      width: 10px;
      height: 10px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: #d0d0cc;
      cursor: pointer;
      transition: transform 180ms ease, background-color 180ms ease;
    }

    .carousel-dot:hover {
      transform: scale(1.08);
    }

    .carousel-dot.is-active {
      background: var(--text);
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 56px;
    }

    .info-card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
    }

    .info-card p {
      margin: 0;
      line-height: 1.8;
    }

    .footer-frame {
      display: block;
      width: 100%;
      height: 88px;
      margin-top: 40px;
      border: 0;
    }

    @media (max-width: 820px) {
      .hero,
      .info {
        grid-template-columns: 1fr;
      }

      .hero {
        gap: 28px;
      }

      .hero .phone-frame {
        max-width: 360px;
      }

      .footer-frame {
        height: 112px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <img src="icon.png" alt="App 图标">
      <div>
        <strong>放放</strong>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="phone-frame">
          <div class="carousel" id="app-carousel" aria-label="App 截图轮播">
            <div class="carousel-track">
              <div class="carousel-slide">
                <img src="imgs/p1.png" alt="App 截图 1">
              </div>
              <div class="carousel-slide">
                <img src="imgs/p2.png" alt="App 截图 2">
              </div>
              <div class="carousel-slide">
                <img src="imgs/p3.png" alt="App 截图 3">
              </div>
              <div class="carousel-slide">
                <img src="imgs/p4.png" alt="App 截图 4">
              </div>
              <div class="carousel-slide">
                <img src="imgs/p5.png" alt="App 截图 5">
              </div>
            </div>
            <div class="carousel-dots" aria-label="轮播导航">
              <button class="carousel-dot is-active" type="button" aria-label="查看第 1 张截图" data-slide="0"></button>
              <button class="carousel-dot" type="button" aria-label="查看第 2 张截图" data-slide="1"></button>
              <button class="carousel-dot" type="button" aria-label="查看第 3 张截图" data-slide="2"></button>
              <button class="carousel-dot" type="button" aria-label="查看第 4 张截图" data-slide="3"></button>
              <button class="carousel-dot" type="button" aria-label="查看第 5 张截图" data-slide="4"></button>
            </div>
          </div>
        </div>

        <div class="intro">
          <p>
            扣出图片中的主体，自动生成贴纸，并记录在地图上，留下属于你的足迹。
          </p>
          <a
            class="store-badge"
            href="https://apps.apple.com/app/id6762321359"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Download on the App Store"
          >
            <span class="store-badge-mark" aria-hidden="true"></span>
            <span class="store-badge-copy">
              <small>Download on the</small>
              <strong>App Store</strong>
            </span>
          </a>
        </div>
      </section>
    </main>

    <iframe
      class="footer-frame"
      src="footer.html"
      title="网站底部"
      loading="lazy"
    ></iframe>
  </div>
  <script>
    (function () {
      var carousel = document.getElementById("app-carousel");
      if (!carousel) {
        return;
      }

      var track = carousel.querySelector(".carousel-track");
      var dots = Array.from(carousel.querySelectorAll(".carousel-dot"));
      var total = dots.length;
      var currentIndex = 0;
      var intervalId = null;
      var autoplayDelay = 3200;

      function render(index) {
        currentIndex = index;
        track.style.transform = "translateX(-" + index * 100 + "%)";

        dots.forEach(function (dot, dotIndex) {
          var isActive = dotIndex === index;
          dot.classList.toggle("is-active", isActive);
          dot.setAttribute("aria-current", isActive ? "true" : "false");
        });
      }

      function next() {
        render((currentIndex + 1) % total);
      }

      function startAutoplay() {
        clearInterval(intervalId);
        intervalId = window.setInterval(next, autoplayDelay);
      }

      dots.forEach(function (dot) {
        dot.addEventListener("click", function () {
          render(Number(dot.dataset.slide));
          startAutoplay();
        });
      });

      render(0);
      startAutoplay();
    }());
  </script>
</body>
</html>
