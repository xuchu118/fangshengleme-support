<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放生了么</title>
  <meta name="description" content="一个简约的 App 展示页。">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #e9e9e6;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.06);
      font-family: "Avenir Next", "PingFang SC", "Helvetica Neue", sans-serif;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 56px;
    }

    header img {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    header div {
      display: grid;
      gap: 2px;
    }

    header strong {
      font-size: 17px;
      font-weight: 600;
    }

    header span,
    .intro p,
    .info-card p,
    footer p {
      color: var(--muted);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 48px;
      align-items: center;
    }

    .intro h1 {
      margin: 0 0 18px;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .intro p {
      margin: 0 0 28px;
      max-width: 520px;
      font-size: 18px;
      line-height: 1.8;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .meta span {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-size: 14px;
      color: var(--muted);
    }

    .phone-frame {
      width: 100%;
    }

    .carousel {
      overflow: hidden;
      width: 100%;
    }

    .carousel-track {
      display: flex;
      transition: transform 420ms ease;
      will-change: transform;
    }

    .carousel-slide {
      flex: 0 0 100%;
      min-width: 100%;
    }

    .carousel-slide img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: var(--shadow);
    }

    .info-card h2 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: -0.03em;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .carousel-dot {
      width: 10px;
      height: 10px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: #d0d0cc;
      cursor: pointer;
      transition: transform 180ms ease, background-color 180ms ease;
    }

    .carousel-dot:hover {
      transform: scale(1.08);
    }

    .carousel-dot.is-active {
      background: var(--text);
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 56px;
    }

    .info-card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
    }

    .info-card p {
      margin: 0;
      line-height: 1.8;
    }

    footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 14px;
    }

    .footer-links a {
      color: var(--muted);
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--text);
    }

    footer p {
      margin: 0;
      font-size: 14px;
    }

    .copyright {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .hero,
      .info {
        grid-template-columns: 1fr;
      }

      .hero {
        gap: 28px;
      }

      .hero .phone-frame {
        max-width: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <img src="icon.png" alt="App 图标">
      <div>
        <strong>放生了么</strong>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="phone-frame">
          <div class="carousel" id="app-carousel" aria-label="App 截图轮播">
            <div class="carousel-track">
              <div class="carousel-slide">
                <img src="imgs/p1.png" alt="App 截图 1">
              </div>
              <div class="carousel-slide">
                <img src="imgs/p2.png" alt="App 截图 2">
              </div>
              <div class="carousel-slide">
                <img src="imgs/p3.png" alt="App 截图 3">
              </div>
              <div class="carousel-slide">
                <img src="imgs/p4.png" alt="App 截图 4">
              </div>
              <div class="carousel-slide">
                <img src="imgs/p5.png" alt="App 截图 5">
              </div>
            </div>
            <div class="carousel-dots" aria-label="轮播导航">
              <button class="carousel-dot is-active" type="button" aria-label="查看第 1 张截图" data-slide="0"></button>
              <button class="carousel-dot" type="button" aria-label="查看第 2 张截图" data-slide="1"></button>
              <button class="carousel-dot" type="button" aria-label="查看第 3 张截图" data-slide="2"></button>
              <button class="carousel-dot" type="button" aria-label="查看第 4 张截图" data-slide="3"></button>
              <button class="carousel-dot" type="button" aria-label="查看第 5 张截图" data-slide="4"></button>
            </div>
          </div>
        </div>

        <div class="intro">
          <p>
            放生了么 是一款赛博放生iOS应用。你只需一张图片，就能完成一次数字放生，并留下自己的善念足迹。
          </p>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-links">
        <a href="privacy.html">隐私政策</a>
        <a href="terms.html">使用条款</a>
        <a href="contact.html">联系我们</a>
      </div>
      <p class="copyright">© 2026 放生了么. All rights reserved.</p>
    </footer>
  </div>
  <script>
    (function () {
      var carousel = document.getElementById("app-carousel");
      if (!carousel) {
        return;
      }

      var track = carousel.querySelector(".carousel-track");
      var dots = Array.from(carousel.querySelectorAll(".carousel-dot"));
      var total = dots.length;
      var currentIndex = 0;
      var intervalId = null;
      var autoplayDelay = 3200;

      function render(index) {
        currentIndex = index;
        track.style.transform = "translateX(-" + index * 100 + "%)";

        dots.forEach(function (dot, dotIndex) {
          var isActive = dotIndex === index;
          dot.classList.toggle("is-active", isActive);
          dot.setAttribute("aria-current", isActive ? "true" : "false");
        });
      }

      function next() {
        render((currentIndex + 1) % total);
      }

      function startAutoplay() {
        clearInterval(intervalId);
        intervalId = window.setInterval(next, autoplayDelay);
      }

      dots.forEach(function (dot) {
        dot.addEventListener("click", function () {
          render(Number(dot.dataset.slide));
          startAutoplay();
        });
      });

      render(0);
      startAutoplay();
    }());
  </script>
</body>
</html>
